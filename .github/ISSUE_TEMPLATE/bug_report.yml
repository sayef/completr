name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: Code, documents and queries that show the problem. Please use synthetic data.
      render: python
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: completr version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: interface
    attributes:
      label: Interface
      options: [Python, Rust]
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "OS, CPU architecture, Python or Rust version, storage backend"
