name: Release

on:
  push:
    tags: ["v*"]
  # release-plz pushes its tags with GITHUB_TOKEN, which does not trigger `push`.
  workflow_run:
    workflows: [Release-plz]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and publish, e.g. v0.1.0
        required: false

permissions:
  contents: read

jobs:
  tag:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      ref: ${{ steps.tag.outputs.ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - id: tag
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          case "$EVENT" in
            workflow_run) tag=$(git tag --points-at HEAD --list 'v*' | sort -V | tail -n 1) ;;
            workflow_dispatch) tag=$([[ "$INPUT_TAG" == v* ]] && echo "$INPUT_TAG" || true) ;;
            *) tag=$([[ "$GITHUB_REF" == refs/tags/v* ]] && echo "$GITHUB_REF_NAME" || true) ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "ref=${tag:-$(git rev-parse HEAD)}" >> "$GITHUB_OUTPUT"
          echo "Release tag: ${tag:-none}"

  wheels:
    needs: tag
    if: needs.tag.outputs.tag != '' || github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64, manylinux: auto }
          # manylinux2014's aarch64 cross gcc rejects flags mimalloc passes.
          - { os: ubuntu-latest, target: aarch64, manylinux: "2_28" }
          - { os: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2 }
          - { os: macos-latest, target: aarch64 }
          - { os: macos-latest, target: x86_64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.tag.outputs.ref }}
          persist-credentials: false
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          args: --release --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}-${{ matrix.manylinux || 'native' }}
          path: dist

  sdist:
    needs: tag
    if: needs.tag.outputs.tag != '' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.tag.outputs.ref }}
          persist-credentials: false
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist

  pypi:
    needs: [tag, wheels, sdist]
    if: needs.tag.outputs.tag != ''
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
