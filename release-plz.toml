[workspace]
# Publish only when a release PR is merged, not on every push to main.
release_always = false
changelog_update = false
git_release_enable = false
git_tag_enable = false
publish = false
pr_labels = ["release"]
semver_check = true

[[package]]
name = "strato"
changelog_update = true
changelog_path = "CHANGELOG.md"
changelog_include = ["strato-py", "strato-cli"]
publish = true
git_tag_enable = true
git_tag_name = "v{{ version }}"
git_release_enable = true
git_release_name = "v{{ version }}"

# Released with the library at the same version.
[[package]]
name = "strato-cli"
publish = true

# Versioned through the workspace version, built and published to PyPI by release.yml.
[[package]]
name = "strato-py"
release = false

[changelog]
header = """# Changelog

All notable changes to this project are documented here. The format follows
[Keep a Changelog](https://keepachangelog.com/en/1.1.0/), and the project uses
[Semantic Versioning](https://semver.org/).

## [Unreleased]
"""

# Generated sections go right below `## [Unreleased]`, so hand-written notes there join the release.
body = """

## [{{ version }}]\
    {%- if release_link -%}({{ release_link }}){% endif %} \
    - {{ timestamp | date(format="%Y-%m-%d") }}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}

{% for commit in commits -%}
- {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
  {% if commit.breaking %}[**breaking**] {% endif %}\
  {{ commit.message | split(pat="\n") | first | trim | upper_first }}
{% endfor -%}
{% endfor %}
"""

trim = true
protect_breaking_commits = true
sort_commits = "oldest"

commit_parsers = [
    { message = "^chore(\\(.*\\))?: release", skip = true },
    { message = "^Merge (pull request|branch)", skip = true },
    { message = "^(feat|[Aa]dd|[Ss]upport|[Ii]ntroduce)", group = "<!-- 0 -->Added" },
    { message = "^(deprecated|[Dd]eprecate)", group = "<!-- 2 -->Deprecated" },
    { message = "^(remove|[Rr]emove|[Dd]elete|[Dd]rop)", group = "<!-- 3 -->Removed" },
    { message = "^(fix|[Ff]ix)", group = "<!-- 4 -->Fixed" },
    { message = "^(security|[Ss]ecurity)", group = "<!-- 5 -->Security" },
    { message = "^(chore|ci|build|test|style)(\\(.*\\))?:", skip = true },
    { message = ".*", group = "<!-- 1 -->Changed" },
]
