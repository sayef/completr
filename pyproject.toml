[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "strato"
description = "Layered autocompletion: prefix, infix, fuzzy, abbreviation, semantic and hybrid search over immutable, memory-mapped segments"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Saiful Islam" }]
requires-python = ">=3.11"
keywords = ["autocomplete", "typeahead", "search", "fuzzy", "vector-search"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Rust",
    "Topic :: Database :: Database Engines/Servers",
    "Topic :: Text Processing :: Indexing",
    "Typing :: Typed",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/sayef/strato"
Documentation = "https://github.com/sayef/strato#readme"
Changelog = "https://github.com/sayef/strato/blob/main/CHANGELOG.md"
Issues = "https://github.com/sayef/strato/issues"

[tool.maturin]
manifest-path = "crates/strato-py/Cargo.toml"
python-source = "crates/strato-py/python"
module-name = "strato.strato"
features = ["pyo3/extension-module"]
