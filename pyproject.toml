[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "completr"
description = "Serverless autocompletion engine for Rust and Python: exact, prefix, infix, abbreviation, spelling-tolerant, word-decomposing and semantic completions from object storage"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Saiful Islam" }]
requires-python = ">=3.11"
keywords = ["autocomplete", "autocompletion", "serverless", "suggestions", "spelling-correction", "fuzzy-search", "semantic-search", "hybrid-search"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Rust",
    "Topic :: Database :: Database Engines/Servers",
    "Topic :: Text Processing :: Indexing",
    "Typing :: Typed",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/sayef/completr"
Documentation = "https://github.com/sayef/completr#readme"
Changelog = "https://github.com/sayef/completr/blob/main/CHANGELOG.md"
Issues = "https://github.com/sayef/completr/issues"

[tool.maturin]
manifest-path = "crates/completr-py/Cargo.toml"
python-source = "crates/completr-py/python"
module-name = "completr.completr"
features = ["pyo3/extension-module"]
