site_name: completr
site_description: "Serverless autocompletion: an embedded engine whose database is a bucket."
site_url: https://completr.pages.dev/
repo_url: https://github.com/sayef/completr
repo_name: sayef/completr
edit_uri: edit/main/docs/
copyright: Copyright &copy; Saiful Islam. Released under the MIT License.

theme:
  name: material
  logo: assets/wordmark-dark.svg
  favicon: assets/logo.svg
  font:
    text: Source Sans 3
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit
    - toc.follow
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [crates/completr-py/python]
          options:
            allow_inspection: false
            show_root_heading: true
            show_root_full_path: false
            show_source: false
            show_signature_annotations: true
            separate_signature: true
            signature_crossrefs: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            docstring_style: google
            filters: ["!^_"]
            show_if_no_docstring: true
            merge_init_into_class: true
            heading_level: 2

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

hooks:
  - docs/hooks.py

exclude_docs: |
  hooks.py
  __pycache__/

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Concepts: concepts.md
  - Guides:
      - Documents: guides/documents.md
      - Completion: guides/completion.md
      - Semantic and hybrid: guides/semantic-hybrid.md
      - Layers: guides/layers.md
      - Serverless deployment: guides/serverless.md
      - Many writers: guides/writers.md
      - asyncio: guides/asyncio.md
      - Collections: guides/collections.md
      - Command line: guides/cli.md
      - Observability: guides/observability.md
      - Configuration: guides/configuration.md
  - Reference:
      - Python API: reference/python.md
      - Rust API: reference/rust.md
  - Architecture: architecture.md
  - Benchmarks: benchmarks.md
  - About:
      - FAQ: faq.md
      - Changelog: changelog.md
      - Contributing: contributing.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/sayef/completr
