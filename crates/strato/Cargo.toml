[package]
name = "strato"
description = "Serverless autocompletion engine for Rust and Python: exact, prefix, infix, abbreviation, spelling-tolerant, word-decomposing and semantic completions from object storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/strato"
readme = "../../README.md"
keywords = ["autocomplete", "autocompletion", "serverless", "spelling", "search"]
categories = ["text-processing", "data-structures", "database-implementations"]
exclude = ["tests/", "examples/", "benches/"]

[package.metadata.docs.rs]
features = ["store", "aws-credentials", "gcp", "azure"]

[dependencies]
arc-swap = "1.7"
fst = "0.4"
memmap2 = "0.9"
rustc-hash = "2"
rayon = "1.10"
tracing = { version = "0.1", default-features = false, features = ["std"] }
rapidfuzz = "0.5"
turbovec = "1.0.0"
zstd = "0.13"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
fsst-rs = "0.6"
async-trait = { version = "0.1", optional = true }
aws-config = { version = "1", optional = true, default-features = false, features = ["behavior-version-latest", "credentials-process", "rt-tokio", "sso", "default-https-client"] }
aws-credential-types = { version = "1", optional = true }
futures = { version = "0.3", optional = true, default-features = false, features = ["std"] }
object_store = { version = "0.14", optional = true }
serde = { version = "1", optional = true, features = ["derive"] }
serde_json = { version = "1", optional = true, features = ["float_roundtrip"] }
uuid = { version = "1", optional = true, features = ["v4"] }
tokio = { version = "1", optional = true, features = ["rt-multi-thread", "net", "time"] }
url = { version = "2", optional = true }

[features]
default = []
# Segment and object storage on the local file system or behind a URL.
store = ["dep:object_store", "dep:tokio", "dep:futures", "dep:url", "dep:serde", "dep:serde_json", "dep:uuid"]
aws = ["store", "object_store/aws"]
gcp = ["store", "object_store/gcp"]
azure = ["store", "object_store/azure"]
# Resolve S3 credentials through the AWS SDK chain (profiles, SSO, web identity, ECS, IMDS).
aws-credentials = ["aws", "dep:aws-config", "dep:aws-credential-types", "dep:async-trait"]

[dev-dependencies]
turbovec = "1.0.0"
tempfile = "3"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
libc = "0.2"
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "search"
harness = false

[[example]]
name = "database_bench"
required-features = ["store"]

[[example]]
name = "soak"
required-features = ["store"]

[[example]]
name = "live_updates"
required-features = ["store"]
