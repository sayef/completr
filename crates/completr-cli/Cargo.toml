[package]
name = "completr-cli"
description = "Command-line tool for completr databases: inspect, import, complete, compact, clean up and ingest"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
readme = "../../README.md"
keywords = ["autocomplete", "autocompletion", "cli", "serverless", "search"]
categories = ["command-line-utilities", "text-processing"]

[[bin]]
name = "completr"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
serde_json = "1"
completr = { path = "../completr", version = "0.2.1", features = ["aws-credentials", "gcp", "azure"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "signal"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }
